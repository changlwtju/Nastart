name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'agent/nastart_agent.py'
      - 'agent/qrencoder*'
      - 'agent/compose.sh'
      - 'scripts/build_agent_installer.py'
      - 'scripts/install_agent.sh'
      - 'scripts/build_spk.sh'
      - 'spk/**'
      - '.github/workflows/deploy-website.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build downloads for the published Agent version
        run: |
          set -eu
          image=$(NASTART_DOCKERHUB_NAMESPACE=changlwtju sh agent/compose.sh --image)
          docker buildx imagetools inspect "$image" > /dev/null
          mkdir -p pages-output
          cp -R website/. pages-output/
          python3 scripts/build_agent_installer.py pages-output/install.sh
          sh -n pages-output/install.sh
          SPK_BUILD_NUMBER=$(printf '%04d' "$((GITHUB_RUN_NUMBER + 9))") bash scripts/build_spk.sh pages-output/nastart-agent.spk

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-output/

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
